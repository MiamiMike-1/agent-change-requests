# Publishes @agent-change-requests/server to npm when a tag like server-v0.1.0 is pushed.
# Needs an npm organization named agent-change-requests and a repository secret
# NPM_TOKEN holding an npm automation token that can publish to it.
name: Release server package

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          if [ "server-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: npm run typecheck --workspace packages/server
      - run: npm test --workspace packages/server
      - run: npm run build --workspace packages/server
      - run: npm publish --workspace packages/server --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
