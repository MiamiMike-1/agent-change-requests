# Publishes @agent-change-requests/server to npm when a tag like server-v0.1.0 is pushed.
# Publishing uses npm trusted publishing (OIDC) only. No npm token is passed: when
# NODE_AUTH_TOKEN is set, npm publishes with that token instead of OIDC, and a package
# that requires 2FA refuses it (E403). Trusted publishing must be set up for the package
# on npmjs.com, with this repository and this workflow file.
name: Release server package

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          if [ "server-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: npm run typecheck --workspace packages/server
      - run: npm test --workspace packages/server
      - run: npm run build --workspace packages/server
      - run: npm publish --workspace packages/server --access public
